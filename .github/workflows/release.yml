name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: bun-linux-x64
            os: ubuntu-latest
            artifact: maxmux-linux-x64

          - target: bun-linux-arm64
            os: ubuntu-latest
            artifact: maxmux-linux-arm64

          - target: bun-darwin-arm64
            os: macos-latest
            artifact: maxmux-darwin-arm64

          - target: bun-darwin-x64
            os: macos-13
            artifact: maxmux-darwin-x64

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install

      - name: Typecheck
        run: bun run typecheck

      - name: Build standalone binary
        run: bun build --compile --target=${{ matrix.target }} --minify src/index.ts --outfile ${{ matrix.artifact }}

      - name: Verify binary exists
        run: ls -lh ${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Make binaries executable
        run: chmod +x artifacts/maxmux-*

      - name: Generate checksums
        working-directory: artifacts
        run: sha256sum maxmux-* > checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/maxmux-linux-x64
            artifacts/maxmux-linux-arm64
            artifacts/maxmux-darwin-arm64
            artifacts/maxmux-darwin-x64
            artifacts/checksums.txt
